name: Build Unity Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-unity-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential cppcheck

    - name: Setup MISRA C Configuration
      run: |
        cat > cppcheck.cfg << 'EOF'
        [common]
        language=c
        std=c99
        
        [misra]
        enable=all
        
        [suppressions]
        missingIncludeSystem
        unmatchedSuppression
        unusedFunction
        EOF
        
        echo "Found C files for analysis:"
        find elab/ -name "*.c" -not -path "*/3rd/Unity/*" | head -10
    
    - name: MISRA C Static Analysis
      run: |
        echo "Running cppcheck analysis..."
        cppcheck --enable=all \
          --inconclusive \
          --xml \
          --xml-version=2 \
          --suppress=missingIncludeSystem \
          --suppress=unmatchedSuppression \
          --suppress=unusedFunction \
          --std=c99 \
          --platform=unix32 \
          -I elab/common/ \
          -I elab/3rd/ \
          elab/common/ \
          elab/elib/ \
          2> cppcheck-report.xml || true
        
        echo "Attempting MISRA C analysis..."
        if cppcheck --addon=misra --help > /dev/null 2>&1; then
          echo "MISRA addon available, running MISRA analysis..."
          cppcheck --addon=misra \
            --enable=all \
            --xml \
            --xml-version=2 \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --std=c99 \
            elab/common/ \
            elab/elib/ \
            2> misra-report.xml || true
        else
          echo "MISRA addon not available, using standard cppcheck analysis"
          cp cppcheck-report.xml misra-report.xml
        fi
        
        echo "Static Analysis Results:"
        echo "========================"
        
        if [ -s cppcheck-report.xml ]; then
          total_issues=$(grep -o "<error " cppcheck-report.xml | wc -l)
          error_count=$(grep -o 'severity="error"' cppcheck-report.xml | wc -l)
          warning_count=$(grep -o 'severity="warning"' cppcheck-report.xml | wc -l)
          
          echo "Total issues found: $total_issues"
          echo "Errors: $error_count"
          echo "Warnings: $warning_count"
          
          if [ $error_count -gt 0 ]; then
            echo "Code quality check failed due to errors"
          else
            echo "No critical issues found"
          fi
        else
          echo "No issues detected"
        fi
    
    - name: Configure CMake for unity_test
      run: |
        cd example/unity_test
        rm -rf build
        cmake -B build -DCMAKE_BUILD_TYPE=Debug
    
    - name: Build unity_test
      run: |
        cd example/unity_test
        cmake --build build
    
    - name: Run unity_test
      run: |
        cd example/unity_test/build
        
        echo "Running unity tests..."
        echo "unity" | timeout 30 ./unity_example > test_output.txt 2>&1 || true
        
        echo "========= Test Output ========="
        cat test_output.txt
        echo "==============================="
        
        echo ""
        echo "=== Unity Test Results ==="
        
        if grep -q "FAIL" test_output.txt; then
          echo "Status: FAILED (Some tests failed)"
          echo "Check the detailed output above for failures"
          exit 1
        elif grep -q "OK" test_output.txt; then
          echo "Status: PASSED (All tests successful)"
        else
          echo "Status: UNKNOWN (Could not determine test result)"
          echo "The output does not contain OK or FAIL"
          exit 1
        fi
    
    - name: Upload Static Analysis Report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: static-analysis-report
        path: |
          cppcheck-report.xml
          misra-report.xml
          cppcheck.cfg
        retention-days: 14
        
    - name: Code Quality Summary
      if: always()
      run: |
        echo "Code Quality Analysis Summary:"
        echo "================================"
        
        if [ -f cppcheck-report.xml ] && [ -s cppcheck-report.xml ]; then
          total_issues=$(grep -o "<error " cppcheck-report.xml | wc -l)
          critical_errors=$(grep -o 'severity="error"' cppcheck-report.xml | wc -l)
          
          echo "Total issues found: $total_issues"
          echo "Critical errors: $critical_errors"
          
          if [ $critical_errors -gt 0 ]; then
            echo "Code quality check: FAILED"
          elif [ $total_issues -gt 0 ]; then
            echo "Code quality check: WARNINGS"
          else
            echo "Code quality check: PASSED"
          fi
        else
          echo "Code quality check: PASSED (no issues)"
        fi
        
        echo ""
        echo "Detailed analysis report uploaded as artifact"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v5
      with:
        name: unity-test-build
        path: |
          example/unity_test/build/unity_example
          example/unity_test/build/compile_commands.json
        retention-days: 7